name: Kiểm tra chất lượng

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Cài đúng lockfile
        run: pnpm install --frozen-lockfile
      - name: Cài Chromium cho smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Kiểm tra tương thích Expo và dependency mobile
        run: pnpm check:mobile
      - name: Test kiến trúc, API, UI, web–API và dev regression
        run: pnpm test
      - name: Build web/API và Metro JavaScript Android + iOS (không phải native build)
        run: pnpm build
      - name: Chuẩn bị Trivy chính thức đã khóa checksum (chỉ runner Linux)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/goease-trivy-tool"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 --retry 2 \
            'https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz' \
            --output "$RUNNER_TEMP/goease-trivy-tool/trivy.tar.gz"
          printf '%s  %s\n' 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f' "$RUNNER_TEMP/goease-trivy-tool/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/goease-trivy-tool/trivy.tar.gz" -C "$RUNNER_TEMP/goease-trivy-tool" trivy
      - name: Kiểm chứng container production, proxy và backup PostgreSQL cô lập
        env:
          GOEASE_TRIVY_BIN: ${{ runner.temp }}/goease-trivy-tool/trivy
          GOEASE_IMAGE_REPORT_DIR: ${{ runner.temp }}/goease-image-reports
          GOEASE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node deploy/ci-containers.mjs
      # Một job tuần tự: không continue-on-error, không skip bước bắt buộc,
      # không path filter. Chỉ xanh khi toàn bộ kiểm tra thành công.
