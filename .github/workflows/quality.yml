name: Kiểm tra chất lượng

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Cài đúng lockfile
        run: pnpm install --frozen-lockfile
      - name: Cài Chromium cho smoke test
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test kiến trúc, API, UI, web–API và dev regression
        run: pnpm test
      - name: Build
        run: pnpm build
      # Một job tuần tự: không continue-on-error, không skip bước bắt buộc,
      # không path filter. Chỉ xanh khi toàn bộ kiểm tra thành công.
