name: Kiểm tra chất lượng

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: goease_ci_admin
          POSTGRES_PASSWORD: ${{ github.run_id }}_fixture
          POSTGRES_DB: goease_test_ci
        ports:
          - 55476:5432
        options: >-
          --health-cmd "pg_isready -U goease_ci_admin -d goease_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Cài đúng lockfile
        run: pnpm install --frozen-lockfile
      - name: Kiểm tra tài liệu và mẫu credential
        run: pnpm check:docs
      - name: Kiểm tra dependency theo Expo SDK
        run: pnpm check:expo
      - name: TypeScript
        run: pnpm typecheck
      - name: Kiểm tra định dạng backend
        run: pnpm --filter @goease/api format:check
      - name: Kiểm tra định dạng PWA, admin và client dùng chung
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Kiểm thử packages, mobile và HTTP API thật
        run: pnpm test
      - name: Dev offline và kiểm tra production vẫn yêu cầu đăng nhập
        run: pnpm --filter @goease/web test:offline
      - name: Cài Chromium cho PWA và admin
        run: pnpm --filter @goease/admin exec playwright install --with-deps chromium
      - name: PWA trên Chromium — CRUD, offline, nhiều tab và tài khoản
        run: pnpm test:web
      - name: Migration, ownership, rollback và restart PostgreSQL thật cô lập
        env:
          GOEASE_DB_TEST_ADMIN_URL: postgresql://goease_ci_admin:${{ github.run_id }}_fixture@127.0.0.1:55476/goease_test_ci
          GOEASE_DB_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm test:db
      - name: Build API và xuất bundle Android, iOS, web
        run: pnpm build
