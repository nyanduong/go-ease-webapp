name: iPhone unsigned trial package

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Approved live HTTPS API URL ending /api; no secret
        required: true
        type: string
      web_google_client_id:
        description: Existing public Web audience matching the live backend
        required: true
        type: string
      ios_google_client_id:
        description: Existing public iOS PREVIEW client for vn.goease.mobile.preview
        required: true
        type: string
      free_storage_verified:
        description: Owner account free storage rechecked; Actions/Packages $0 stop budgets; no paid runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: iphone-trial-package
  cancel-in-progress: false

jobs:
  ipa:
    name: Package unsigned iPhone Release
    if: github.repository == 'nyanduong/go-ease-webapp' && github.event.repository.private == false && github.ref == 'refs/heads/main' && inputs.free_storage_verified == true
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      COCOAPODS_DISABLE_STATS: 'true'
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      GOEASE_APP_VARIANT: preview
      GOEASE_SOURCE_HEAD: ${{ github.sha }}
      GOEASE_FREE_STORAGE_VERIFIED: ${{ inputs.free_storage_verified }}
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_url }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ inputs.web_google_client_id }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ inputs.ios_google_client_id }}
      GOOGLE_MAPS_ANDROID_API_KEY: ''
      GOOGLE_MAPS_IOS_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - name: Guard public config and reviewed free standard toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.21.0'
          test "$(pnpm --version)" = '10.34.6'
          test "$(pod --version)" = '1.17.0'
          test "$(xcodebuild -version)" = $'Xcode 27.0\nBuild version 27A266a'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          node apps/mobile/scripts/iphone-trial.mjs preflight
          test "$(git rev-parse HEAD)" = "$GOEASE_SOURCE_HEAD"
      - name: Frozen dependencies and shared contracts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @goease/contracts build
      - name: Generate preview native project
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          test ! -e ios
          template="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('expo/package.json')), 'template.tgz')")"
          test -s "$template"
          pnpm exec expo prebuild --platform ios --no-install --no-clean --template "$template" --skip-dependency-update expo,react,react-native
          test -d ios/GoEasePreview.xcodeproj
          git diff --exit-code
      - name: Native Pods and unsigned Release archive with bundled JS
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          pod install
          test -d GoEasePreview.xcworkspace
          xcodebuild -quiet -hideShellScriptEnvironment \
            -workspace GoEasePreview.xcworkspace -scheme GoEasePreview \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -jobs 2 -derivedDataPath "$RUNNER_TEMP/goease-iphone-derived" \
            -archivePath "$RUNNER_TEMP/goease-iphone.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' archive
          git diff --exit-code
      - name: Inspect and package only the unsigned app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/goease-iphone.xcarchive/Products/Applications/GoEasePreview.app"
          test -s "$app/main.jsbundle"
          xcrun lipo -verify_arch arm64 "$app/GoEasePreview"
          xcrun vtool -show-build "$app/GoEasePreview"
          plutil -convert json -o "$RUNNER_TEMP/goease-iphone-info.json" "$app/Info.plist"
          mkdir "$RUNNER_TEMP/goease-iphone-package" "$RUNNER_TEMP/goease-iphone-download"
          mkdir "$RUNNER_TEMP/goease-iphone-package/Payload"
          ditto "$app" "$RUNNER_TEMP/goease-iphone-package/Payload/GoEasePreview.app"
          (cd "$RUNNER_TEMP/goease-iphone-package" && ditto -c -k --keepParent Payload "$RUNNER_TEMP/goease-iphone-download/GoEasePreview-unsigned.ipa")
          node apps/mobile/scripts/iphone-trial.mjs inspect "$app" "$RUNNER_TEMP/goease-iphone-info.json" \
            "$RUNNER_TEMP/goease-iphone-download/receipt.json" "$RUNNER_TEMP/goease-iphone-download/GoEasePreview-unsigned.ipa"
          git diff --exit-code
      - name: Store one bounded unsigned package for owner download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goease-iphone-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/goease-iphone-download/GoEasePreview-unsigned.ipa
            ${{ runner.temp }}/goease-iphone-download/receipt.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
      # No Apple credentials/profiles, signing, EAS, store upload or runtime success claim.
