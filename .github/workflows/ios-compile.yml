name: iOS native compile only

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-compile.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.npmrc'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      ios_google_client_id:
        description: Public iOS DEVELOPMENT OAuth client ID; bỏ trống để dùng repo variable, không nhập secret
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS unsigned native compile
    # Standard public runner only. No secrets, signing, paid/larger runners or storage.
    if: github.repository == 'nyanduong/go-ease-webapp' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      COCOAPODS_DISABLE_STATS: 'true'
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      GOEASE_APP_VARIANT: development
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ inputs.ios_google_client_id || vars.GOEASE_IOS_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ''
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ''
      GOOGLE_MAPS_ANDROID_API_KEY: ''
      GOOGLE_MAPS_IOS_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - name: Verify reviewed native toolchain and public config
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.21.0'
          test "$(pnpm --version)" = '10.34.6'
          test "$(pod --version)" = '1.17.0'
          test "$(xcodebuild -version)" = $'Xcode 27.0\nBuild version 27A266a'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          printf 'Checkout commit: '; git rev-parse HEAD
          printf 'PR source HEAD: %s\n' "$GOEASE_SOURCE_HEAD"
          node --input-type=module -e '
            const value = process.env.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID;
            if (!value || !/^[0-9]+-[a-z0-9-]+\.apps\.googleusercontent\.com$/.test(value))
              throw Error("Missing valid public iOS development OAuth ID; no sample IDs.");
          '
        env:
          GOEASE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Frozen dependencies and shared contracts
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @goease/contracts build
      - name: Generate iOS native project from pinned Expo template
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          test ! -e ios
          template="$(node -p "require('node:path').join(require('node:path').dirname(require.resolve('expo/package.json')), 'template.tgz')")"
          test -s "$template"
          pnpm exec expo prebuild --platform ios --no-install --no-clean --template "$template" --skip-dependency-update expo,react,react-native
          test -d ios/GoEaseDev.xcodeproj
          git diff --exit-code
      - name: Install native Pods
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          pod install
          test -d GoEaseDev.xcworkspace
          git diff --exit-code
      - name: Verify generated scheme
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          xcodebuild -list -json -workspace ios/GoEaseDev.xcworkspace > "$RUNNER_TEMP/goease-ios-schemes.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/goease-ios-schemes.json", "utf8"));
            if (!value.workspace?.schemes?.includes("GoEaseDev")) throw Error("Expected scheme GoEaseDev missing.");
          '
      - name: Archive native Release without signing
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          xcodebuild -quiet -hideShellScriptEnvironment \
            -workspace ios/GoEaseDev.xcworkspace -scheme GoEaseDev \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -jobs 2 -derivedDataPath "$RUNNER_TEMP/goease-ios-derived" \
            -archivePath "$RUNNER_TEMP/goease-ios-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' archive
      - name: Inspect archive, bundled JS and OAuth URL scheme
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/goease-ios-unsigned.xcarchive/Products/Applications/GoEaseDev.app"
          test -d "$app"
          test -s "$app/main.jsbundle"
          plutil -convert json -o "$RUNNER_TEMP/goease-ios-info.json" "$app/Info.plist"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/goease-ios-info.json", "utf8"));
            assert.equal(value.CFBundleIdentifier, "vn.goease.mobile.dev");
            assert.equal(value.CFBundleExecutable, "GoEaseDev");
            assert.ok(value.CFBundleSupportedPlatforms.includes("iPhoneOS"));
            const schemes = value.CFBundleURLTypes.flatMap(type => type.CFBundleURLSchemes);
            const reversed = "com.googleusercontent.apps." + process.env.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID.replace(".apps.googleusercontent.com", "");
            assert.ok(schemes.includes("goease-dev") && schemes.includes(reversed));
            console.info("Expected bundle ID/platform/GoEase and Google callback schemes verified; no login performed.");
          '
          xcrun lipo -verify_arch arm64 "$app/GoEaseDev"
          xcrun vtool -show-build "$app/GoEaseDev"
          shasum -a 256 apps/mobile/ios/Podfile.lock "$app/main.jsbundle" "$app/GoEaseDev"
          git diff --exit-code
          printf '%s\n' 'Unsigned native Release archive + bundled JS only; no signing/install/runtime/live/UAT.'
      # Archive stays on this disposable runner. No artifact/cache upload or IPA export.
