name: goease-staging
services:
  api:
    image: ${GOEASE_API_IMAGE:?Set immutable API image reference}
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m,mode=1777]
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 20s
    secrets: [api_env]
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  admin:
    image: ${GOEASE_ADMIN_IMAGE:?Set immutable admin image reference}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m,mode=1777]
    pids_limit: 64
    mem_limit: 128m
    environment:
      STAGING_HOST: ${STAGING_HOST:?Set owner-approved HTTPS ingress hostname}
    ports: ["127.0.0.1:${GOEASE_PROXY_PORT:-8080}:8080"]
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
  operator:
    profiles: [operator]
    image: ${GOEASE_OPERATOR_IMAGE:?Set immutable operator image reference}
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]
    pids_limit: 128
    mem_limit: 512m
    secrets: [operator_env]
    networks: [private]
  pg-tools:
    profiles: [operator]
    image: ${GOEASE_PG_TOOLS_IMAGE:?Set immutable pg-tools image reference}
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    pids_limit: 32
    mem_limit: 256m
    secrets: [pg_service, pg_pass]
    volumes: ["${GOEASE_BACKUP_DIR:?Set private backup directory outside repository}:/backups"]
    networks: [private]
networks:
  # No API/database published ports. Owner attaches a private DB route here.
  private:
    external: true
    name: ${GOEASE_PRIVATE_NETWORK:?Set existing owner-managed private network}
secrets:
  api_env: {file: "${GOEASE_API_ENV_FILE:?Set private API env file outside repository}"}
  operator_env: {file: "${GOEASE_OPERATOR_ENV_FILE:?Set separate operator env file outside repository}"}
  pg_service: {file: "${GOEASE_PG_SERVICE_FILE:?Set private PostgreSQL service file}"}
  pg_pass: {file: "${GOEASE_PG_PASS_FILE:?Set private PostgreSQL password file}"}
