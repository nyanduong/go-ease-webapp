appId: vn.goease.mobile.uiproof
name: Trips home native component fixtures (no OAuth/API)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Chuyến đi của tôi"
    timeout: 120000
- assertVisible: "＋  Tạo chuyến mẫu"
- takeScreenshot: trips-home-native
- tapOn: "＋  Tạo chuyến mẫu"
- assertVisible: "Fixture nhận thao tác: Tạo chuyến mẫu."
- scrollUntilVisible:
    element: "Mở Cuối tuần cùng nhau"
    direction: DOWN
- assertVisible: "6.000.000 VND"
- takeScreenshot: trips-card-native
- tapOn: "Mở Cuối tuần cùng nhau"
- assertVisible: "Fixture nhận thao tác: Mở chuyến mẫu."
- tapOn: "Đổi ca kiểm thử"
- assertVisible: "Chuyến đầu tiên đang chờ bạn."
- takeScreenshot: trips-empty-native
- tapOn: "Đổi ca kiểm thử"
- scrollUntilVisible:
    element: "Đọc chuyến lại"
    direction: DOWN
- tapOn: "Đọc chuyến lại"
- assertVisible: "Fixture nhận thao tác: Đọc chuyến lại."
- takeScreenshot: trips-error-native
- tapOn: "Đổi ca kiểm thử"
- assertVisible: "Đang đọc chuyến…"
- takeScreenshot: trips-loading-native
- tapOn: "Đổi ca kiểm thử"
- scrollUntilVisible:
    element: "Tiếp tục bản đang chỉnh"
    direction: DOWN
- tapOn: "Tiếp tục bản đang chỉnh"
- assertVisible: "Fixture nhận thao tác: Tiếp tục bản đang chỉnh/gửi."
- takeScreenshot: trips-draft-native
- tapOn: "Đổi ca kiểm thử"
- assertVisible: "Tiếp tục bản đang gửi"
- takeScreenshot: trips-pending-native
