# Stop only the test-owned API process before this flow; keep the app/Metro running.
appId: vn.goease.mobile.dev
---
- scrollUntilVisible:
    element: "Kiểm tra lại kết nối API"
    direction: DOWN
    timeout: 10000
- tapOn: "Kiểm tra lại kết nối API"
- scrollUntilVisible:
    element: "Chưa kết nối được API"
    direction: UP
    timeout: 20000
- assertVisible: "Chưa kết nối được API. Kiểm tra mạng và địa chỉ máy chủ, rồi thử lại."
- takeScreenshot: health-network-error
