# Requires the real local API and Metro for the installed development client.
appId: vn.goease.mobile.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 60000
- openLink: ${DEV_CLIENT_URL}
# clearState also resets the SDK57 development-menu introduction.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "API đang hoạt động"
    timeout: 120000
- assertVisible: "Đã nhận phản hồi health hợp lệ từ máy chủ."
- takeScreenshot: health-success
